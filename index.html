<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Interval — a little practice, a better ear.</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js" defer></script>
    <script src="app.js" defer></script>
  </head>

  <body>
    <main>
      <div class="workspace">
        <aside
          class="panel settings-panel"
          aria-label="Your practice"
          data-i18n-aria="practice"
        >
          <div class="section-label">
            <span data-i18n="intervals">INTERVALS</span>
            <button id="select-all" class="text-button">Select all</button>
          </div>

          <div id="interval-options" class="interval-options"></div>
          <div class="settings-divider"></div>
          <div class="section-label" data-i18n="advanceLabel">
            NEXT QUESTION
          </div>

          <div
            class="segmented"
            id="advance-mode"
            role="group"
            aria-label="Next question mode"
            data-i18n-aria="advanceGroup"
          >
            <button
              data-advance="manual"
              aria-pressed="true"
              data-i18n="advanceManual"
            >
              Manual
            </button>

            <button
              data-advance="countdown"
              aria-pressed="false"
              data-i18n="advanceCountdown"
            >
              Countdown
            </button>
          </div>

          <div class="countdown-options" id="countdown-options" hidden>
            <label for="countdown-seconds" data-i18n="countdownDelay"
              >Delay after answering</label
            >
            <select id="countdown-seconds">
              <option value="3">3 seconds</option>
              <option value="5" selected>5 seconds</option>
              <option value="10">10 seconds</option>
            </select>
          </div>

          <div class="settings-divider"></div>
          <div
            class="section-label"
            id="bass-settings-label"
            data-i18n="yourBass"
          >
            YOUR BASS
          </div>

          <div
            class="segmented"
            id="string-count"
            role="group"
            aria-label="Number of bass strings"
            data-i18n-aria="stringGroup"
          >
            <button data-strings="4">4 strings</button
            ><button data-strings="5">5 strings</button
            ><button data-strings="6">6 strings</button>
          </div>

          <div class="settings-divider"></div>
          <div class="section-label language-label" data-i18n="language">
            Language
          </div>

          <div
            class="language-switch"
            role="group"
            aria-label="Language"
            data-i18n-aria="language"
          >
            <button
              type="button"
              data-language="en"
              lang="en"
              aria-label="English"
              title="English"
              aria-pressed="true"
            >
              <span aria-hidden="true">🇬🇧</span>
            </button>

            <button
              type="button"
              data-language="pt-BR"
              lang="pt-BR"
              aria-label="Português brasileiro"
              title="Português brasileiro"
              aria-pressed="false"
            >
              <span aria-hidden="true">🇧🇷</span>
            </button>
          </div>
        </aside>

        <div class="practice-panels">
          <section class="panel quiz-panel" aria-labelledby="quiz-heading">
            <div class="quiz-top">
              <span class="eyebrow" id="quiz-heading" data-i18n="findNote"
                >FIND THE NOTE</span
              >
            </div>

            <div class="question-equation">
              <div class="root-tile">
                <strong id="root-note">C</strong>
              </div>

              <span class="equation-plus">+</span>
              <div class="interval-tile">
                <strong id="interval-short">M3</strong>
              </div>

              <span class="equation-arrow">→</span>
              <div class="answer-tile">
                <strong id="target-note">?</strong>
                <button
                  id="next-question"
                  class="next-button"
                  aria-label="Next question"
                  data-i18n-aria="next"
                  hidden
                  disabled
                >
                  <svg id="next-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span id="countdown-label" class="next-countdown" aria-hidden="true" hidden></span>
                </button>
              </div>
            </div>

            <div class="answer-heading">
              <span class="keyboard-hint" data-i18n="keyboard"
                >Type A–G · Shift for ♯ / ♭</span
              >
            </div>

            <div class="answer-grid" id="answer-grid"></div>
          </section>

          <section class="panel circle-panel" aria-labelledby="circle-heading">
            <h2 class="section-label" id="circle-heading" data-i18n="circle">
              Circle of fifths
            </h2>

            <div id="circle" class="circle-container"></div>
          </section>

          <section
            class="panel fretboard-panel"
            aria-labelledby="fretboard-heading"
          >
            <div class="fretboard-header">
              <div>
                <div class="panel-heading">
                  <h2
                    class="section-label"
                    id="fretboard-heading"
                    data-i18n="fretboard"
                  >
                    FRETBOARD
                  </h2>
                </div>
              </div>

            </div>

            <div class="fretboard-scroll"><div id="fretboard"></div></div>
          </section>

          <section
            class="panel stats-panel"
            aria-label="Your progress"
            data-i18n-aria="progress"
          >
            <div class="stats-summary">
              <div class="stats-row">
                <div>
                  <strong id="accuracy">—</strong
                  ><span data-i18n="accuracy">ACCURACY</span>
                </div>

                <div>
                  <strong id="correct-count">0<span> / 0</span></strong
                  ><span data-i18n="correctLabel">CORRECT</span>
                </div>

                <div>
                  <strong id="streak"
                    >0<span class="streak-flame">♨</span></strong
                  ><span data-i18n="streak">CURRENT STREAK</span>
                </div>

                <div>
                  <strong id="answer-time">—</strong
                  ><span data-i18n="answerTime">AVG. ANSWER TIME</span>
                </div>
              </div>

              <button class="text-button reset-button" id="reset-stats">
                ↺ <span data-i18n="reset">Reset</span>
              </button>
            </div>

            <button
              id="details-toggle"
              class="text-button details-toggle"
              aria-expanded="false"
              aria-controls="stats-details"
            >
              Interval breakdown <span>⌄</span>
            </button>

            <div id="stats-details" hidden></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
